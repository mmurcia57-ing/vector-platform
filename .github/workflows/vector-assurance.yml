name: vector-assurance
on:
  push:
    branches:
      - framework/vector-full-lifecycle-pilot
      - experiment/vector-knowledge-rechallenge-v2
  workflow_dispatch:
concurrency:
  group: vector-assurance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
