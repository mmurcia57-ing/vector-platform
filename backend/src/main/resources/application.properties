spring.application.name=vector-bff
server.port=${VECTOR_BFF_PORT:8080}
vector.runtime.environment=${VECTOR_RUNTIME_ENVIRONMENT:local}
vector.reliability.policy.reference=${VECTOR_RELIABILITY_POLICY_REFERENCE:local-dataset-v1}
vector.reliability.policy.minimum-recurring-incidents=${VECTOR_MINIMUM_RECURRING_INCIDENTS:2}
vector.reliability.policy.minimum-supporting-evidence=${VECTOR_MINIMUM_SUPPORTING_EVIDENCE:2}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
